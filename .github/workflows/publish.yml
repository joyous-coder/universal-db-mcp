name: Publish to NPM

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so platform-specific optional deps
        # (e.g. esbuild prebuilt binaries) for the CI runner are resolved.
        # Force the official registry explicitly so any user-level npmrc
        # on the runner cannot redirect installs to an unreachable mirror.
        run: npm install --no-audit --no-fund --registry https://registry.npmjs.org/

      - name: Build project
        run: npm run build

      - name: Run tests (must pass before publish)
        # Enforce: failing tests block the publish. v3.2.1+ requirement.
        run: npm test

      - name: Check package version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Package version: $PACKAGE_VERSION"

      - name: Verify CHANGELOG entry exists for this version
        # Enforce: every release must have a CHANGELOG entry. v3.2.1+ requirement.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "🔍 Checking CHANGELOG.md for [${VERSION}] entry..."
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md is missing an entry for version ${VERSION}"
            echo "Add a section like '## [${VERSION}] - YYYY-MM-DD' before publishing."
            exit 1
          fi
          echo "✅ CHANGELOG.md contains entry for ${VERSION}"

      # Trusted Publishing via OIDC — no NPM_TOKEN secret required.
      # Configure the trusted publisher on npmjs.com first (see docs/superpowers/specs).
      - name: Publish to NPM
        run: npm publish --provenance --access public --registry https://registry.npmjs.org/

      - name: Success notification
        if: success()
        run: |
          echo "✅ Successfully published version ${{ steps.version.outputs.version }} to NPM via Trusted Publishing"
          echo "📦 Package: https://www.npmjs.com/package/@joyous-coder/universal-db-mcp"

      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Failed to publish to NPM"
          echo "Common causes:"
          echo "  - Tests failing (run 'npm test' locally to reproduce)"
          echo "  - Build failing (run 'npm run build' locally to reproduce)"
          echo "  - Missing CHANGELOG entry for this version (add '## [vX.Y.Z] - YYYY-MM-DD' section)"
          echo "  - Network / registry issues"
          echo "Please check the logs above for details"
