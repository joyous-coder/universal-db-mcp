name: Publish to NPM

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so platform-specific optional deps
        # (e.g. esbuild prebuilt binaries) for the CI runner are resolved.
        run: npm install --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Check package version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Package version: $PACKAGE_VERSION"

      # Trusted Publishing via OIDC — no NPM_TOKEN secret required.
      # Configure the trusted publisher on npmjs.com first (see docs/superpowers/specs).
      - name: Publish to NPM
        run: npm publish --provenance --access public

      - name: Success notification
        if: success()
        run: |
          echo "✅ Successfully published version ${{ steps.version.outputs.version }} to NPM via Trusted Publishing"
          echo "📦 Package: https://www.npmjs.com/package/@joyous-coder/universal-db-mcp"

      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Failed to publish to NPM"
          echo "Please check the logs above for details"
